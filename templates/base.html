<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventory{% endblock %}{% if cfg.business_name %} · {{ cfg.business_name }}{% endif %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">{{ cfg.business_name or 'Inventory' }}</a>
    <nav>
      <a href="{{ url_for('items') }}" {% if request.endpoint in ('items', 'item_detail', 'item_edit', 'item_new') %}class="on"{% endif %}>Inventory</a>
      <a href="{{ url_for('sales') }}" {% if request.endpoint == 'sales' %}class="on"{% endif %}>Sales</a>
      <a href="{{ url_for('ebay_purchases') }}" {% if request.endpoint == 'ebay_purchases' %}class="on"{% endif %}>eBay purchases</a>
      <a href="{{ url_for('ebay_sales') }}" {% if request.endpoint == 'ebay_sales' %}class="on"{% endif %}>eBay sold</a>
      <a href="{{ url_for('settings') }}" {% if request.endpoint == 'settings' %}class="on"{% endif %}>Settings</a>
    </nav>
    <form class="scan" action="{{ url_for('scan') }}" method="get">
      <input id="scan" name="q" type="search" placeholder="Scan a label or search…" autocomplete="off"
             {% if not no_scan_focus %}autofocus{% endif %}>
    </form>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
